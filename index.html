$('#libraryResizer').onpointerdown=beginLibraryResize;$('#libraryResizer').onkeydown=event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();setLibraryWidth(libraryWidth+(event.key==='ArrowLeft'?24:-24))}};window.addEventListener('resize',()=>{if(innerWidth>850)setLibraryWidth(libraryWidth)});
['dialog','drawDialog','decksDialog','listImportDialog'].forEach(id=>{const modal=$(`#${id}`);modal.addEventListener('click',event=>{if(event.target===modal)modal.close()});modal.addEventListener('close',hideCardPreview)});
$('#drawBtn').onclick=startDrawSession;$('#listImportBtn').onclick=()=>openListImport('current');$('#decksBtn').onclick=showDeckManager;$('#homeBtn').onclick=showDeckManager;$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#langBtn').onclick=toggleLanguage;$('#themeBtn').onclick=event=>{event.stopPropagation();$('#themeMenu').hidden=!$('#themeMenu').hidden};$$('[data-theme-choice]').forEach(button=>button.onclick=()=>setTheme(button.dataset.themeChoice));document.addEventListener('click',event=>{if(!$('#themeMenu').hidden&&!$('#themeMenu').contains(event.target)&&event.target!==$('#themeBtn'))$('#themeMenu').hidden=true});$('#saveBtn').onclick=explicitSave;$('#exportBtn').onclick=exportDeck;$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=event=>event.target.files[0]&&importDeck(event.target.files[0]);$('#shareBtn').onclick=copyList;
document.addEventListener('keydown',handleKeyboardShortcuts);window.addEventListener('beforeunload',()=>{scheduleLibrarySearch.flush();scheduleDeckSave.flush()});
render();
